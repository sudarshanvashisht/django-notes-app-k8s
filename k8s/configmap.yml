apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-app-config
  namespace: notes-app

data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost,http://127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
  DJANGO_DB_ENGINE: "django.db.backends.mysql"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
