name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mynotes/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install backend deps
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Django check
        run: DJANGO_USE_SQLITE=true python manage.py check

      - name: Django tests
        run: DJANGO_USE_SQLITE=true python manage.py test api

      - name: Install frontend deps
        working-directory: mynotes
        run: npm ci

      - name: Frontend tests
        working-directory: mynotes
        run: npm run test:ci

      - name: Frontend build
        working-directory: mynotes
        run: npm run build

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: Docker build
        run: docker build -t notes-app-k8s:ci .

      - name: Kubernetes render
        run: kubectl kustomize k8s > /dev/null
